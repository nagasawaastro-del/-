  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

async function cloudLoad() {
  const { data, error } = await supabaseClient.from('factory_data').select('data').eq('id', 'main').maybeSingle();
  if (error) throw error;
  return data ? data.data : null;
}
async function cloudSave(obj) {
  const { error } = await supabaseClient.from('factory_data').upsert({ id: 'main', data: obj, updated_at: new Date().toISOString() });
  if (error) throw error;
}

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

function AuthBar({ session }) {
  const [open, setOpen] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  if (session) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: C.textDim }}>
        <User size={13} />
        <span className="fm-mono">{session.user.email}</span>
        <button
          onClick={() => authSignOut()}
          className="fm-btn"
          style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.textDim, borderRadius: 6, padding: '3px 9px', cursor: 'pointer', fontSize: 11 }}
        >ログアウト</button>
      </div>
    );
  }

  const submit = async () => {
    setErr('');
    if (!email || !password) { setErr('メールアドレスとパスワードを入力してください。'); return; }
    setBusy(true);
    try {
      await authSignIn(email, password);
      setOpen(false);
      setEmail(''); setPassword('');
    } catch (e) {
      setErr('ログインできませんでした。メールアドレス・パスワードをご確認ください。');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ position: 'relative' }}>
      <button
        onClick={() => setOpen((o) => !o)}
        className="fm-btn"
        style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.text, borderRadius: 6, padding: '5px 12px', cursor: 'pointer', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}

            <input className="fm-input" type="email" placeholder="メールアドレス" value={email} onChange={(e) => setEmail(e.target.value)} />

            <PrimaryButton onClick={submit} style={{ justifyContent: 'center' }}>{busy ? 'ログイン中…' : 'ログイン'}</PrimaryButton>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState('idle'); // idle | saving | saved | error
  const [tab, setTab] = useState('dashboard');
  const [session, setSession] = useState(null);
  const isEditor = !!session;

  /* --- ログイン状態の監視 --- */
  useEffect(() => {
    if (!CONFIGURED) return;
    supabaseClient.auth.getSession().then(({ data: d }) => setSession(d.session));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  /* --- 読み込み(Supabase) --- */
  const isFirstLoad = React.useRef(true);
  const loadFromCloud = useCallback(async () => {
    try {
      const remote = await cloudLoad();
      setData(normalizeData(remote));
      setSaveStatus('saved');
    } catch (e) {
      console.error(e);
      setSaveStatus('error');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { loadFromCloud(); }, [loadFromCloud]);

  // 他の人の更新を定期的に取り込む(10秒ごと)
  useEffect(() => {
    const iv = setInterval(() => { if (!loading) loadFromCloud(); }, 10000);
    return () => clearInterval(iv);
  }, [loading, loadFromCloud]);

  /* --- 保存(デバウンス) --- */
  useEffect(() => {
    if (loading || !data) return;
    if (isFirstLoad.current) { isFirstLoad.current = false; return; }
    setSaveStatus('saving');
    const t = setTimeout(async () => {
      try {
        await cloudSave(data);
        setSaveStatus('saved');
      } catch (e) {
        console.error(e);
        setSaveStatus('error');
      }
    }, 600);
    return () => clearTimeout(t);
  }, [data, loading]);

  const lineById = useCallback((id) => data?.lines.find((l) => l.id === id), [data]);
  const lotById = useCallback((id) => data?.lots.find((l) => l.id === id), [data]);
  const orderById = useCallback((id) => data?.orders.find((o) => o.id === id), [data]);
  const salesOrderById = useCallback((id) => data?.salesOrders.find((s) => s.id === id), [data]);
  const productById = useCallback((id) => data?.products.find((p) => p.id === id), [data]);

  const orderStats = useCallback((orderId) => {
    const recs = (data?.records || []).filter((r) => r.orderId === orderId);
    return recs.reduce((acc, r) => ({
      machineUp: acc.machineUp + num(r.machineUpQty),
      inspected: acc.inspected + num(r.inspectedQty),
      folded: acc.folded + num(r.foldedQty),
      defect: acc.defect + num(r.defectQty),
    }), { machineUp: 0, inspected: 0, folded: 0, defect: 0 });
  }, [data]);

  const salesOrderStats = useCallback((salesOrderId) => {
    const planIds = (data?.orders || []).filter((o) => o.salesOrderId === salesOrderId).map((o) => o.id);
    const recs = (data?.records || []).filter((r) => planIds.includes(r.orderId));
    return recs.reduce((acc, r) => ({
      machineUp: acc.machineUp + num(r.machineUpQty),
      folded: acc.folded + num(r.foldedQty),
    }), { machineUp: 0, folded: 0 });
  }, [data]);

  /* --- 追加・削除アクション --- */
  const addLine = (name) => setData((d) => ({ ...d, lines: [...d.lines, { id: uid('L'), name }] }));
  const removeLine = (id) => setData((d) => ({ ...d, lines: d.lines.filter((l) => l.id !== id) }));

  const addProduct = (p) => setData((d) => ({ ...d, products: [...d.products, { id: uid('P'), ...p }] }));
  const updateProduct = (id, patch) => setData((d) => ({ ...d, products: d.products.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
  const removeProduct = (id) => setData((d) => ({ ...d, products: d.products.filter((p) => p.id !== id) }));

  const addSalesOrder = (so) => setData((d) => ({ ...d, salesOrders: [...d.salesOrders, { id: uid('SO'), ...so }] }));
  const updateSalesOrder = (id, patch) => setData((d) => ({ ...d, salesOrders: d.salesOrders.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  const removeSalesOrder = (id) => setData((d) => ({ ...d, salesOrders: d.salesOrders.filter((s) => s.id !== id) }));

  const addLot = (lot) => setData((d) => ({ ...d, lots: [...d.lots, { id: uid('LOT'), ...lot }] }));
  const updateLot = (id, patch) => setData((d) => ({ ...d, lots: d.lots.map((l) => (l.id === id ? { ...l, ...patch } : l)) }));
  const removeLot = (id) => setData((d) => ({ ...d, lots: d.lots.filter((l) => l.id !== id) }));

  // 資材の入出庫記録(生産計画とは独立して、日々の在庫の増減だけを記録する)
  const addMaterialTransaction = (tx) => setData((d) => {
    const lot = d.lots.find((l) => l.id === tx.lotId);
    if (!lot) return d;
    const delta = tx.type === '入庫' ? num(tx.qty) : -num(tx.qty);
    const lots = d.lots.map((l) => (l.id === tx.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) + delta) } : l));
    return { ...d, lots, materialTransactions: [...d.materialTransactions, { id: uid('MT'), ...tx }] };
  });
  const removeMaterialTransaction = (id) => setData((d) => {
    const tx = d.materialTransactions.find((t) => t.id === id);
    if (!tx) return { ...d, materialTransactions: d.materialTransactions.filter((t) => t.id !== id) };
    const delta = tx.type === '入庫' ? -num(tx.qty) : num(tx.qty);
    const lots = d.lots.map((l) => (l.id === tx.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) + delta) } : l));
    return { ...d, lots, materialTransactions: d.materialTransactions.filter((t) => t.id !== id) };
  });

  const addOrder = (order) => setData((d) => ({ ...d, orders: [...d.orders, { id: uid('O'), ...order }] }));
  const updateOrder = (id, patch) => setData((d) => ({ ...d, orders: d.orders.map((o) => (o.id === id ? { ...o, ...patch } : o)) }));
  const removeOrder = (id) => setData((d) => ({ ...d, orders: d.orders.filter((o) => o.id !== id), records: d.records.filter((r) => r.orderId !== id) }));

  const addRecord = (rec) => setData((d) => {
    let lots = d.lots;
    let products = d.products;
    const ord = d.orders.find((o) => o.id === rec.orderId);
    if (ord && ord.lotId && rec.materialUsedLength) {
      lots = d.lots.map((l) => (l.id === ord.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) - num(rec.materialUsedLength)) } : l));
    }
    if (ord && ord.productId && rec.foldedQty) {
      products = d.products.map((p) => (p.id === ord.productId ? { ...p, finishedStock: num(p.finishedStock) + num(rec.foldedQty) } : p));
    }
    return { ...d, lots, products, records: [...d.records, { id: uid('R'), ...rec }] };
  });
  const updateRecord = (id, patch) => setData((d) => {
    const old = d.records.find((r) => r.id === id);
    if (!old) return d;
    const merged = { ...old, ...patch };
    let lots = d.lots;
    let products = d.products;
    const oldOrd = d.orders.find((o) => o.id === old.orderId);
    const newOrd = d.orders.find((o) => o.id === merged.orderId);
    if (oldOrd && oldOrd.lotId && old.materialUsedLength) {
      lots = lots.map((l) => (l.id === oldOrd.lotId ? { ...l, remainingLength: num(l.remainingLength) + num(old.materialUsedLength) } : l));
    }
    if (newOrd && newOrd.lotId && merged.materialUsedLength) {
      lots = lots.map((l) => (l.id === newOrd.lotId ? { ...l, remainingLength: Math.max(0, num(l.remainingLength) - num(merged.materialUsedLength)) } : l));
    }
    if (oldOrd && oldOrd.productId && old.foldedQty) {
      products = products.map((p) => (p.id === oldOrd.productId ? { ...p, finishedStock: Math.max(0, num(p.finishedStock) - num(old.foldedQty)) } : p));
    }
    if (newOrd && newOrd.productId && merged.foldedQty) {
      products = products.map((p) => (p.id === newOrd.productId ? { ...p, finishedStock: num(p.finishedStock) + num(merged.foldedQty) } : p));
    }
    return { ...d, lots, products, records: d.records.map((r) => (r.id === id ? merged : r)) };
  });
  const removeRecord = (id) => setData((d) => {
    const old = d.records.find((r) => r.id === id);
    if (!old) return { ...d, records: d.records.filter((r) => r.id !== id) };
    let lots = d.lots;
    let products = d.products;
    const ord = d.orders.find((o) => o.id === old.orderId);
    if (ord && ord.lotId && old.materialUsedLength) {
      lots = lots.map((l) => (l.id === ord.lotId ? { ...l, remainingLength: num(l.remainingLength) + num(old.materialUsedLength) } : l));
    }
    if (ord && ord.productId && old.foldedQty) {
      products = products.map((p) => (p.id === ord.productId ? { ...p, finishedStock: Math.max(0, num(p.finishedStock) - num(old.foldedQty)) } : p));
    }
    return { ...d, lots, products, records: d.records.filter((r) => r.id !== id) };
  });

  if (loading || !data) {
    return (
      <div style={{ background: C.bg, minHeight: 400, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textDim, borderRadius: 12 }}>
        <Loader2 className="fm-mono" size={20} style={{ marginRight: 8, animation: 'spin 1s linear infinite' }} />
        読み込み中...
        <style>{`@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }`}</style>
      </div>
    );
  }

  const TABS = [
    { id: 'dashboard', label: 'ダッシュボード', icon: Gauge },
    { id: 'products', label: '商品マスタ', icon: Box },
    { id: 'salesorders', label: '受注', icon: FileText },
    { id: 'plan', label: '生産計画', icon: ClipboardList },
    { id: 'inventory', label: '資材管理', icon: Package },
    { id: 'production', label: '生産実績・WIP', icon: Activity },
    { id: 'calendar', label: 'カレンダー', icon: Calendar },
    { id: 'quality', label: '品質管理', icon: AlertTriangle },
  ];

  return (
    <div className="fm-root" style={{ background: C.bg, color: C.text, borderRadius: 12, padding: 18, minHeight: 400 }}>
      <style>{FONT_STYLE}</style>

      {/* ヘッダー */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 10, marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 34, height: 34, borderRadius: 8, background: C.tealDim, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Scissors size={17} color={C.teal} />
          </div>
          <div>
            <div className="fm-display" style={{ fontSize: 22, fontWeight: 700, lineHeight: 1 }}>不織布加工 生産管理</div>
            <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>資材 → 溶着・裁断 → 検品 → たたみ 工程トラッカー</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <div className="fm-mono" style={{ fontSize: 11, color: C.textFaint, display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{
                width: 6, height: 6, borderRadius: 999,
                background: saveStatus === 'saving' ? C.amber : saveStatus === 'error' ? C.red : C.green,
              }} />
              {saveStatus === 'saving' ? '保存中…' : saveStatus === 'error' ? '保存エラー(接続を確認)' : 'クラウドと同期済み'}
            </span>
            <button onClick={loadFromCloud} className="fm-btn" style={{ background: C.panelAlt2, border: `1px solid ${C.border}`, color: C.textDim, borderRadius: 6, padding: '3px 9px', cursor: 'pointer', fontSize: 11 }}>更新</button>
          </div>
          <AuthBar session={session} />
        </div>
      </div>

      {!isEditor && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: C.textDim }}>
          <Lock size={13} /> 現在は閲覧のみのモードです。入力・編集を行うには右上からログインしてください。
        </div>
      )}

      {/* タブ */}
      <div style={{ display: 'flex', gap: 4, borderBottom: `1px solid ${C.border}`, marginBottom: 16, overflowX: 'auto' }}>
        {TABS.map((t) => {
          const active = tab === t.id;
          const Icon = t.icon;
          return (
            <button
              key={t.id}
              className="fm-tab"
              onClick={() => setTab(t.id)}
              style={{
                background: 'transparent', border: 'none', cursor: 'pointer',
                color: active ? C.teal : C.textDim, padding: '8px 12px', fontSize: 13,
                fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6,
                borderBottom: active ? `2px solid ${C.teal}` : '2px solid transparent',
                whiteSpace: 'nowrap',
              }}
            >
              <Icon size={14} /> {t.label}
            </button>
          );
        })}
      </div>

      {tab === 'dashboard' && (
        <DashboardTab data={data} lineById={lineById} orderById={orderById} lotById={lotById} orderStats={orderStats} salesOrderById={salesOrderById} salesOrderStats={salesOrderStats} />
      )}
      {tab === 'products' && (
        <ProductTab data={data} addProduct={addProduct} updateProduct={updateProduct} removeProduct={removeProduct} isEditor={isEditor} />
      )}
      {tab === 'salesorders' && (
        <SalesOrderTab data={data} addSalesOrder={addSalesOrder} updateSalesOrder={updateSalesOrder} removeSalesOrder={removeSalesOrder} salesOrderStats={salesOrderStats} productById={productById} isEditor={isEditor} />
      )}
      {tab === 'plan' && (
        <PlanTab data={data} orderStats={orderStats} addOrder={addOrder} updateOrder={updateOrder} removeOrder={removeOrder} lineById={lineById} lotById={lotById} addLine={addLine} removeLine={removeLine} salesOrderById={salesOrderById} productById={productById} isEditor={isEditor} />
      )}
      {tab === 'inventory' && (
        <InventoryTab data={data} addLot={addLot} updateLot={updateLot} removeLot={removeLot} addMaterialTransaction={addMaterialTransaction} removeMaterialTransaction={removeMaterialTransaction} isEditor={isEditor} />
      )}
      {tab === 'production' && (
        <ProductionTab data={data} addRecord={addRecord} updateRecord={updateRecord} removeRecord={removeRecord} lineById={lineById} orderById={orderById} orderStats={orderStats} productById={productById} lotById={lotById} isEditor={isEditor} />
      )}
      {tab === 'calendar' && (
        <CalendarTab data={data} lineById={lineById} orderById={orderById} orderStats={orderStats} />
      )}
      {tab === 'quality' && (
        <QualityTab data={data} lineById={lineById} orderById={orderById} />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* ダッシュボード                                                       */
/* ------------------------------------------------------------------ */
function DashboardTab({ data, lineById, orderById, lotById, orderStats, salesOrderById, salesOrderStats }) {
  const [date, setDate] = useState(todayStr());
  const todays = data.records.filter((r) => r.date === date);

  const totals = todays.reduce((acc, r) => ({
    machineUp: acc.machineUp + num(r.machineUpQty),
    inspected: acc.inspected + num(r.inspectedQty),
    folded: acc.folded + num(r.foldedQty),
    defect: acc.defect + num(r.defectQty),
  }), { machineUp: 0, inspected: 0, folded: 0, defect: 0 });

  const waitInspect = totals.machineUp - totals.inspected;
  const waitFold = totals.inspected - totals.folded;
  const defectRate = totals.machineUp > 0 ? (totals.defect / totals.machineUp) * 100 : 0;
  const lowStockLots = data.lots.filter((l) => num(l.initialLength) > 0 && num(l.remainingLength) / num(l.initialLength) < 0.2);
  const activeLines = new Set(todays.map((r) => r.lineId)).size;

  const planRows = data.orders.map((o) => ({ o, st: orderStats(o.id) }));
  const completedPlans = planRows.filter(({ o, st }) => o.targetQty > 0 && st.folded >= o.targetQty);
  const completedToday = completedPlans.filter(({ o }) => data.records.some((r) => r.orderId === o.id && r.date === date));

  // 在庫状況(資材・仕掛品・完成品)のサマリー
  const wipStock = planRows.reduce((sum, { st }) => sum + Math.max(0, st.machineUp - st.folded), 0);
  const finishedStockTotal = data.products.reduce((sum, p) => sum + num(p.finishedStock), 0);
  const rawMaterialByUnit = data.lots.reduce((map, l) => {
    const label = unitLabel(l.unit);
    map[label] = (map[label] || 0) + num(l.remainingLength);
    return map;
  }, {});
  const rawMaterialSummary = Object.entries(rawMaterialByUnit).map(([u, v]) => `${fmt(v)}${u}`).join(' / ') || '0';

  // 原材料名ごとの内訳(同じ資材名のロットをまとめて集計)
  const rawMaterialByName = Object.values(data.lots.reduce((map, l) => {
    const key = l.materialName || '(名称未設定)';
    if (!map[key]) map[key] = { name: key, remaining: 0, initial: 0, unit: unitLabel(l.unit), lotCount: 0 };
    map[key].remaining += num(l.remainingLength);
    map[key].initial += num(l.initialLength);
    map[key].lotCount += 1;
    return map;
  }, {}));

  // 商品ごとの在庫内訳(資材・仕掛品・完成品)
  const productStockRows = data.products.map((p) => {
    const linkedOrders = data.orders.filter((o) => o.productId === p.id);
    const wip = linkedOrders.reduce((sum, o) => {
      const st = orderStats(o.id);
      return sum + Math.max(0, st.machineUp - st.folded);
    }, 0);
    const lotIds = [...new Set(linkedOrders.map((o) => o.lotId).filter(Boolean))];
    const lots = lotIds.map((id) => lotById(id)).filter(Boolean);
    return { p, wip, lots };
  });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 12, color: C.textDim }}>対象日</span>
        <input type="date" className="fm-input" style={{ width: 160 }} value={date} onChange={(e) => setDate(e.target.value)} />
      </div>

      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <StatCard icon={Factory} label="稼働ライン数" value={activeLines} unit={`/ ${data.lines.length}`} tone="teal" />
        <StatCard icon={Activity} label="本日 機械上がり" value={fmt(totals.machineUp)} unit="枚" tone="teal" />
        <StatCard icon={ClipboardList} label="検品待ち" value={fmt(Math.max(0, waitInspect))} unit="枚" tone="amber" />
        <StatCard icon={ClipboardList} label="たたみ待ち" value={fmt(Math.max(0, waitFold))} unit="枚" tone="amber" />
        <StatCard icon={CheckCircle2} label="たたみ済み(完成)" value={fmt(totals.folded)} unit="枚" tone="green" />
        <StatCard icon={AlertTriangle} label="不良率" value={defectRate.toFixed(1)} unit="%" tone={defectRate > 5 ? 'red' : 'teal'} />
        <StatCard icon={CheckCircle2} label="完了済み計画" value={completedPlans.length} unit={`/ ${data.orders.length}件`} tone="green" />
      </div>

      {/* 完了済み計画(ひと目でわかるように) */}
      {completedPlans.length > 0 && (
        <Panel style={{ padding: 16, border: `1px solid ${C.greenDim}` }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
            <CheckCircle2 size={16} color={C.green} /> 完了済み計画
            {completedToday.length > 0 && <Badge tone="green">本日 {completedToday.length}件 完了</Badge>}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {completedPlans.map(({ o, st }) => {
              const so = salesOrderById(o.salesOrderId);
              return (
                <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, background: 'rgba(79,179,116,0.08)', borderRadius: 6, padding: '6px 10px', flexWrap: 'wrap' }}>
                  <CheckCircle2 size={13} color={C.green} />
                  <span style={{ fontWeight: 600 }}>{o.planNo}</span>
                  <span style={{ color: C.textDim }}>{o.productName}</span>
                  {so && <span style={{ fontSize: 11, color: C.textFaint }}>({so.customerName}向け)</span>}
                  <span className="fm-mono" style={{ marginLeft: 'auto', color: C.green }}>{fmt(st.folded)} / {fmt(o.targetQty)}枚</span>
                </div>
              );
            })}
          </div>
        </Panel>
      )}

      {/* 受注進捗 */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>受注進捗</div>
        {data.salesOrders.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>受注がまだありません。「受注」タブから登録してください。</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {data.salesOrders.map((so) => {
              const st = salesOrderStats(so.id);
              const ratio = pct(st.folded, so.orderedQty);
              const done = st.folded >= so.orderedQty && so.orderedQty > 0;
              return (
                <div key={so.id} style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', background: done ? 'rgba(79,179,116,0.08)' : C.panelAlt, borderRadius: 8, padding: '8px 12px' }}>
                  <span style={{ fontSize: 13, fontWeight: 600, minWidth: 150, display: 'flex', alignItems: 'center', gap: 6 }}>
                    {done && <CheckCircle2 size={13} color={C.green} />}{so.orderNo} <span style={{ color: C.textDim, fontWeight: 400 }}>{so.customerName}</span>
                  </span>
                  <div style={{ flex: 1, minWidth: 120, maxWidth: 260 }}><ProgressBar ratio={ratio} color={done ? C.green : C.teal} /></div>
                  <span className="fm-mono" style={{ fontSize: 12, color: C.textDim }}>{fmt(st.folded)}/{fmt(so.orderedQty)}枚</span>
                  <span className="fm-mono" style={{ fontSize: 11, color: C.textFaint }}>納期 {so.dueDate}</span>
                </div>
              );
            })}
          </div>
        )}
      </Panel>

      {/* アンドン盤(ライン状況) */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>ライン状況ボード</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {data.lines.map((line) => {
            const recs = todays.filter((r) => r.lineId === line.id);
            const t = recs.reduce((acc, r) => ({
              machineUp: acc.machineUp + num(r.machineUpQty),
              inspected: acc.inspected + num(r.inspectedQty),
              folded: acc.folded + num(r.foldedQty),
              defect: acc.defect + num(r.defectQty),
            }), { machineUp: 0, inspected: 0, folded: 0, defect: 0 });
            const running = recs.length > 0;
            const dRate = t.machineUp > 0 ? (t.defect / t.machineUp) * 100 : 0;
            const statusColor = !running ? C.textFaint : dRate > 5 ? C.red : C.teal;
            const orderIds = [...new Set(recs.map((r) => r.orderId))];
            return (
              <div key={line.id} style={{
                display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap',
                background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 14px',
              }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 110 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 999, background: statusColor }} />
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{line.name}</span>
                </div>
                <Badge tone={running ? 'teal' : 'dim'}>{running ? '稼働中' : '本日実績なし'}</Badge>
                <div className="fm-mono" style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, color: C.textDim, flexWrap: 'wrap' }}>
                  <span style={{ color: C.text }}>{fmt(t.machineUp)}</span><span style={{ fontSize: 10 }}>機械上がり</span>
                  <ChevronRight size={12} />
                  <span style={{ color: C.amber }}>{fmt(Math.max(0, t.machineUp - t.inspected))}</span><span style={{ fontSize: 10 }}>検品待ち</span>
                  <ChevronRight size={12} />
                  <span style={{ color: C.amber }}>{fmt(Math.max(0, t.inspected - t.folded))}</span><span style={{ fontSize: 10 }}>たたみ待ち</span>
                  <ChevronRight size={12} />
                  <span style={{ color: C.green }}>{fmt(t.folded)}</span><span style={{ fontSize: 10 }}>完成</span>
                </div>
                {orderIds.length > 0 && (
                  <span style={{ fontSize: 11, color: C.textFaint, marginLeft: 'auto' }}>
                    {orderIds.map((oid) => orderById(oid)?.productName).filter(Boolean).join(' / ')}
                  </span>
                )}
              </div>
            );
          })}
        </div>
      </Panel>

      {/* 資材アラート */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 10 }}>資材 残量アラート(残20%未満)</div>
        {lowStockLots.length === 0 ? (
          <div style={{ fontSize: 13, color: C.textFaint }}>アラート対象の資材はありません。</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {lowStockLots.map((l) => (
              <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13 }}>
                <AlertTriangle size={14} color={C.red} />
                <span style={{ minWidth: 160 }}>{l.materialName}<span style={{ color: C.textFaint }}> ({l.lotNo})</span></span>
                <div style={{ flex: 1, maxWidth: 240 }}>
                  <ProgressBar ratio={pct(l.remainingLength, l.initialLength)} color={C.red} />
                </div>
                <span className="fm-mono" style={{ color: C.textDim }}>{fmt(l.remainingLength)} / {fmt(l.initialLength)} {unitLabel(l.unit)}</span>
              </div>
            ))}
          </div>
        )}
      </Panel>

      {/* 在庫状況サマリー(資材・仕掛品・完成品) */}
      <Panel style={{ padding: 16 }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>在庫状況(資材・仕掛品・完成品)</div>
        <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>資材(仕入れた原材料)・仕掛品(機械上がり済みでまだ完成していないもの)・完成品(たたみ済みで出荷待ちのもの)の3段階で在庫を確認できます。</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 14 }}>
          <StatCard icon={Package} label="資材 残量合計(単位別)" value={rawMaterialSummary} unit="" tone="teal" />
          <StatCard icon={Activity} label="仕掛品在庫(機械上がり〜たたみ前)" value={fmt(wipStock)} unit="枚" tone="amber" />
          <StatCard icon={CheckCircle2} label="完成品在庫(全商品合計)" value={fmt(finishedStockTotal)} unit="枚" tone="green" />
        </div>
        {rawMaterialByName.length > 0 && (
          <>
            <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim }}>資材 残量(原材料別)</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 16 }}>
              {rawMaterialByName.map((m) => {
                const ratio = pct(m.remaining, m.initial);
                const low = ratio < 20;
                return (
                  <div key={m.name} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, background: C.panelAlt, borderRadius: 6, padding: '6px 10px' }}>
                    <span style={{ minWidth: 160 }}>{m.name}</span>
                    <span style={{ fontSize: 11, color: C.textFaint, whiteSpace: 'nowrap' }}>{m.lotCount}ロット</span>
                    <div style={{ flex: 1, maxWidth: 220 }}><ProgressBar ratio={ratio} color={low ? C.red : C.teal} /></div>
                    <span className="fm-mono" style={{ marginLeft: 'auto', color: low ? C.red : C.textDim, whiteSpace: 'nowrap' }}>{fmt(m.remaining)} / {fmt(m.initial)} {m.unit}</span>
                  </div>
                );
              })}
            </div>
          </>
        )}
        {data.products.length > 0 && (
          <>
            <div className="fm-display" style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: C.textDim }}>在庫状況(商品別)</div>
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 720 }}>
                <thead>
                  <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
                    {['商品', '保管場所', '資材(紐づくロット)', '仕掛品在庫', '完成品在庫'].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {productStockRows.map(({ p, wip, lots }) => (
                    <tr key={p.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                      <td style={{ padding: '8px' }}>
                        <span className="fm-mono" style={{ color: C.textFaint, fontSize: 11, marginRight: 6 }}>{p.productCode}</span>
                        {p.productName}
                      </td>
                      <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.storageLocation || '—'}</td>
                      <td style={{ padding: '8px', fontSize: 12 }}>
                        {lots.length === 0 ? <span style={{ color: C.textFaint }}>—</span> : (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                            {lots.map((l) => (
                              <span key={l.id} className="fm-mono" style={{ color: C.textDim }}>
                                {l.lotNo}: {fmt(l.remainingLength)}{unitLabel(l.unit)}
                              </span>
                            ))}
                          </div>
                        )}
                      </td>
                      <td className="fm-mono" style={{ padding: '8px', color: C.amber }}>{fmt(wip)}枚</td>
                      <td className="fm-mono" style={{ padding: '8px', color: C.green }}>{fmt(p.finishedStock)}枚</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 商品マスタタブ                                                       */
/* ------------------------------------------------------------------ */
function ProductTab({ data, addProduct, updateProduct, removeProduct, isEditor }) {
  const blankForm = {
    productCode: '', productName: '', spec: '', defaultCustomer: '', materialType: '',
    materialPerUnit: '', speedPerHour: '', minLotQty: '', storageLocation: '', finishedStock: '',
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState('');

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      productCode: p.productCode, productName: p.productName, spec: p.spec || '',
      defaultCustomer: p.defaultCustomer || '', materialType: p.materialType || '',
      materialPerUnit: String(p.materialPerUnit || ''),
      speedPerHour: String(p.speedPerHour || ''), minLotQty: String(p.minLotQty || ''),
      storageLocation: p.storageLocation || '', finishedStock: String(p.finishedStock ?? '0'),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const submit = () => {
    if (!form.productCode || !form.productName) {
      setErr('商品コード・商品名は必須です。');
      return;
    }
    setErr('');
    const payload = {
      ...form,
      materialPerUnit: Number(form.materialPerUnit) || 0,
      speedPerHour: Number(form.speedPerHour) || 0,
      minLotQty: Number(form.minLotQty) || 0,
      finishedStock: Number(form.finishedStock) || 0,
    };
    if (editingId) {
      updateProduct(editingId, payload);
      setEditingId(null);
    } else {
      addProduct(payload);
    }
    setForm(blankForm);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '商品を編集' : '商品を登録'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>受注・生産計画から選べる商品台帳です。標準生産速度と資材使用量(原単位)を入れておくと、計画・実績入力で自動計算されます。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="商品コード"><input className="fm-input" value={form.productCode} onChange={(e) => setForm({ ...form, productCode: e.target.value })} placeholder="PD-004" /></Field>
            <Field label="商品名"><input className="fm-input" value={form.productName} onChange={(e) => setForm({ ...form, productName: e.target.value })} placeholder="例: マスク用シート" /></Field>
            <Field label="規格・サイズ"><input className="fm-input" value={form.spec} onChange={(e) => setForm({ ...form, spec: e.target.value })} placeholder="175mm×95mm" /></Field>
            <Field label="主要得意先"><input className="fm-input" value={form.defaultCustomer} onChange={(e) => setForm({ ...form, defaultCustomer: e.target.value })} placeholder="例: A社" /></Field>
            <Field label="使用原材料"><input className="fm-input" value={form.materialType} onChange={(e) => setForm({ ...form, materialType: e.target.value })} placeholder="PP不織布 20g/m²" /></Field>
            <Field label="資材使用量(1枚あたり)"><input type="number" step="0.001" className="fm-input" value={form.materialPerUnit} onChange={(e) => setForm({ ...form, materialPerUnit: e.target.value })} placeholder="0.05" /></Field>
            <Field label="標準生産速度(枚/時間)"><input type="number" className="fm-input" value={form.speedPerHour} onChange={(e) => setForm({ ...form, speedPerHour: e.target.value })} placeholder="800" /></Field>
            <Field label="最低ロット(枚)"><input type="number" className="fm-input" value={form.minLotQty} onChange={(e) => setForm({ ...form, minLotQty: e.target.value })} placeholder="1000" /></Field>
            <Field label="保管場所"><input className="fm-input" value={form.storageLocation} onChange={(e) => setForm({ ...form, storageLocation: e.target.value })} placeholder="倉庫A-1" /></Field>
            <Field label="完成品在庫(枚)"><input type="number" className="fm-input" value={form.finishedStock} onChange={(e) => setForm({ ...form, finishedStock: e.target.value })} placeholder="0" /></Field>
          </div>
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '商品を登録'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="商品の登録・編集にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>商品一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 900 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['商品コード', '商品名', '規格', '主要得意先', '使用原材料', '原単位(1枚)', '生産速度', '最低ロット', '保管場所', '完成品在庫', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {data.products.length === 0 && (
              <tr><td colSpan={11} style={{ padding: 14, color: C.textFaint }}>商品がありません。上のフォームから登録してください。</td></tr>
            )}
            {data.products.map((p) => (
              <tr key={p.id} style={{ borderBottom: `1px solid ${C.border}`, background: p.id === editingId ? C.tealDim + '55' : 'transparent' }}>
                <td className="fm-mono" style={{ padding: '8px' }}>{p.productCode}</td>
                <td style={{ padding: '8px' }}>{p.productName}</td>
                <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.spec || '—'}</td>
                <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.defaultCustomer || '—'}</td>
                <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.materialType || '—'}</td>
                <td className="fm-mono" style={{ padding: '8px' }}>{p.materialPerUnit ? `${p.materialPerUnit}` : '—'}</td>
                <td className="fm-mono" style={{ padding: '8px' }}>{p.speedPerHour ? `${fmt(p.speedPerHour)}枚/h` : '—'}</td>
                <td className="fm-mono" style={{ padding: '8px' }}>{p.minLotQty ? `${fmt(p.minLotQty)}枚` : '—'}</td>
                <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{p.storageLocation || '—'}</td>
                <td className="fm-mono" style={{ padding: '8px' }}>{fmt(p.finishedStock)}枚</td>
                <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                  {isEditor && <IconBtn onClick={() => startEdit(p)} title="編集" icon={Pencil} />}
                  {isEditor && <IconBtn onClick={() => removeProduct(p.id)} title="削除" danger />}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 受注タブ                                                             */
/* ------------------------------------------------------------------ */
function SalesOrderTab({ data, addSalesOrder, updateSalesOrder, removeSalesOrder, salesOrderStats, productById, isEditor }) {
  const blankForm = { orderNo: '', productId: '', customerName: '', productName: '', orderedQty: '', orderDate: todayStr(), dueDate: '' };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState('');

  const customerOptions = useMemo(
    () => [...new Set([...data.products.map((p) => p.defaultCustomer), ...data.salesOrders.map((so) => so.customerName)].filter(Boolean))],
    [data.products, data.salesOrders],
  );

  const startEdit = (so) => {
    setEditingId(so.id);
    setForm({ orderNo: so.orderNo, productId: so.productId || '', customerName: so.customerName, productName: so.productName, orderedQty: String(so.orderedQty), orderDate: so.orderDate, dueDate: so.dueDate });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const onPickProduct = (productId) => {
    const p = productById(productId);
    setForm((f) => ({
      ...f,
      productId,
      productName: p ? p.productName : f.productName,
      customerName: p && !f.customerName ? (p.defaultCustomer || f.customerName) : f.customerName,
    }));
  };

  const submit = () => {
    if (!form.orderNo || !form.customerName || !form.productName || !form.orderedQty || !form.dueDate) {
      setErr('受注番号・得意先名・製品名・受注数量・納期は必須です。');
      return;
    }
    setErr('');
    if (editingId) {
      updateSalesOrder(editingId, { ...form, orderedQty: Number(form.orderedQty) });
      setEditingId(null);
    } else {
      addSalesOrder({ ...form, orderedQty: Number(form.orderedQty) });
    }
    setForm(blankForm);
  };

  const withStatus = data.salesOrders.map((so) => {
    const linkedPlans = data.orders.filter((o) => o.salesOrderId === so.id);
    const st = salesOrderStats(so.id);
    const status = st.folded >= so.orderedQty && so.orderedQty > 0 ? '完了' : linkedPlans.length > 0 ? '計画中' : '未計画';
    return { so, linkedPlans, st, status };
  });
  const sorted = [...withStatus].sort((a, b) => (a.status === '完了') - (b.status === '完了'));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '受注を編集' : '受注を入力'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>お客様からの注文をここに登録します。この後「生産計画」タブでラインへの割り当てを行います。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="受注番号"><input className="fm-input" value={form.orderNo} onChange={(e) => setForm({ ...form, orderNo: e.target.value })} placeholder="SO-0004" /></Field>
            <Field label="商品(商品マスタから選択)">
              <select className="fm-input" value={form.productId} onChange={(e) => onPickProduct(e.target.value)}>
                <option value="">選択しない(自由入力)</option>
                {data.products.map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}</option>)}
              </select>
            </Field>
            <Field label="得意先名">
              <input list="customer-options" className="fm-input" value={form.customerName} onChange={(e) => setForm({ ...form, customerName: e.target.value })} placeholder="例: D社" />
              <datalist id="customer-options">
                {customerOptions.map((c) => <option key={c} value={c} />)}
              </datalist>
            </Field>
            <Field label="製品名">
              <input
                className="fm-input"
                value={form.productName}
                disabled={!!form.productId}
                onChange={(e) => setForm({ ...form, productName: e.target.value })}
                placeholder="例: マスク用シート"
                style={form.productId ? { opacity: 0.65, cursor: 'not-allowed' } : undefined}
              />
            </Field>
            <Field label="受注数量(枚)"><input type="number" className="fm-input" value={form.orderedQty} onChange={(e) => setForm({ ...form, orderedQty: e.target.value })} placeholder="5000" /></Field>
            <Field label="受注日"><input type="date" className="fm-input" value={form.orderDate} onChange={(e) => setForm({ ...form, orderDate: e.target.value })} /></Field>
            <Field label="納期"><input type="date" className="fm-input" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} /></Field>
          </div>
          {form.productId && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>製品名は商品マスタから自動入力されています。変更したい場合は「選択しない(自由入力)」に戻してください。</div>
          )}
          {form.productId && Number(form.orderedQty) > 0 && productById(form.productId)?.minLotQty > Number(form.orderedQty) && (
            <div style={{ color: C.amber, fontSize: 12, marginBottom: 8 }}>⚠ この商品の最低ロット({fmt(productById(form.productId).minLotQty)}枚)を下回っています。</div>
          )}
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '受注を追加'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="受注の入力にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>受注一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 780 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['受注番号', '得意先', '製品名', '受注数量', '進捗(完成/受注)', '納期', '状態', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {sorted.length === 0 && (
              <tr><td colSpan={8} style={{ padding: 14, color: C.textFaint }}>受注がありません。上のフォームから追加してください。</td></tr>
            )}
            {sorted.map(({ so, linkedPlans, st, status }) => {
              const ratio = pct(st.folded, so.orderedQty);
              const tone = status === '完了' ? 'green' : status === '計画中' ? 'teal' : 'dim';
              return (
                <tr key={so.id} style={{ borderBottom: `1px solid ${C.border}`, background: so.id === editingId ? C.tealDim + '55' : status === '完了' ? C.greenDim + '33' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{so.orderNo}</td>
                  <td style={{ padding: '8px' }}>{so.customerName}</td>
                  <td style={{ padding: '8px' }}>{so.productName}</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{fmt(so.orderedQty)}</td>
                  <td style={{ padding: '8px', minWidth: 170 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ flex: 1 }}><ProgressBar ratio={ratio} color={status === '完了' ? C.green : C.teal} /></div>
                      <span className="fm-mono" style={{ fontSize: 11, color: C.textDim, whiteSpace: 'nowrap' }}>{fmt(st.folded)}/{fmt(so.orderedQty)}</span>
                    </div>
                    {linkedPlans.length === 0 && <div style={{ fontSize: 11, color: C.amber, marginTop: 4 }}>⚠ 生産計画が未作成です</div>}
                  </td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{so.dueDate}</td>
                  <td style={{ padding: '8px' }}>
                    <Badge tone={tone}>{status === '完了' ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><CheckCircle2 size={11} />完了</span> : status}</Badge>
                  </td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(so)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeSalesOrder(so.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 生産計画タブ                                                         */
/* ------------------------------------------------------------------ */
function PlanTab({ data, orderStats, addOrder, updateOrder, removeOrder, lineById, lotById, addLine, removeLine, salesOrderById, productById, isEditor }) {
  const blankForm = { planNo: '', salesOrderId: '', productId: '', productName: '', lineId: data.lines[0]?.id || '', lotId: '', targetQty: '', startDate: todayStr(), dueDate: '' };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [newLine, setNewLine] = useState('');
  const [err, setErr] = useState('');

  const startEdit = (o) => {
    setEditingId(o.id);
    setForm({
      planNo: o.planNo, salesOrderId: o.salesOrderId || '', productId: o.productId || '', productName: o.productName,
      lineId: o.lineId, lotId: o.lotId || '', targetQty: String(o.targetQty),
      startDate: planStart(o), dueDate: planEnd(o),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const submit = () => {
    if (!form.planNo || !form.productName || !form.lineId || !form.targetQty || !form.startDate || !form.dueDate) {
      setErr('計画番号・製品名・ライン・目標数量・開始日・終了日(納期)は必須です。');
      return;
    }
    if (form.startDate > form.dueDate) {
      setErr('開始日は終了日(納期)より前の日付にしてください。');
      return;
    }
    setErr('');
    if (editingId) {
      updateOrder(editingId, { ...form, targetQty: Number(form.targetQty) });
      setEditingId(null);
    } else {
      addOrder({ ...form, targetQty: Number(form.targetQty) });
    }
    setForm(blankForm);
  };

  const onPickSalesOrder = (soId) => {
    const so = salesOrderById(soId);
    setForm((f) => ({
      ...f,
      salesOrderId: soId,
      productId: so && so.productId ? so.productId : f.productId,
      productName: so ? so.productName : f.productName,
      targetQty: so && !f.targetQty ? String(so.orderedQty) : f.targetQty,
      dueDate: so ? so.dueDate : f.dueDate,
    }));
  };

  const onPickProduct = (productId) => {
    const p = productById(productId);
    setForm((f) => ({
      ...f,
      productId,
      productName: p ? p.productName : f.productName,
    }));
  };

  const selectedProduct = productById(form.productId);
  const sortedLots = useMemo(() => {
    if (!selectedProduct) return data.lots;
    return [...data.lots].sort((a, b) => {
      const aMatch = a.materialName === selectedProduct.materialType ? 0 : 1;
      const bMatch = b.materialName === selectedProduct.materialType ? 0 : 1;
      return aMatch - bMatch;
    });
  }, [data.lots, selectedProduct]);
  const estimatedHours = selectedProduct && selectedProduct.speedPerHour > 0 && Number(form.targetQty) > 0
    ? Number(form.targetQty) / selectedProduct.speedPerHour
    : null;
  const belowMinLot = selectedProduct && selectedProduct.minLotQty > 0 && Number(form.targetQty) > 0 && Number(form.targetQty) < selectedProduct.minLotQty;

  const requiredMaterial = selectedProduct && selectedProduct.materialPerUnit > 0 && Number(form.targetQty) > 0
    ? Number(form.targetQty) * selectedProduct.materialPerUnit
    : null;
  const selectedLot = lotById(form.lotId);
  const insufficientStock = requiredMaterial !== null && selectedLot && requiredMaterial > num(selectedLot.remainingLength);

  const rows = data.orders.map((o) => {
    const st = orderStats(o.id);
    const status = st.folded >= o.targetQty && o.targetQty > 0 ? '完了' : st.machineUp > 0 ? '仕掛中' : '未着手';
    return { o, st, status };
  });
  const sortedRows = [...rows].sort((a, b) => (a.status === '完了') - (b.status === '完了'));
  const completedCount = rows.filter((r) => r.status === '完了').length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '生産計画を編集' : '生産計画を追加'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>受注に対してライン・資材・目標数量・生産期間を割り当てます。受注と紐づけない在庫生産もOK。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="紐づく受注(任意)">
              <select className="fm-input" value={form.salesOrderId} onChange={(e) => onPickSalesOrder(e.target.value)}>
                <option value="">受注と紐づけない</option>
                {data.salesOrders.map((so) => <option key={so.id} value={so.id}>{so.orderNo} - {so.customerName} / {so.productName}</option>)}
              </select>
            </Field>
            <Field label="計画番号"><input className="fm-input" value={form.planNo} onChange={(e) => setForm({ ...form, planNo: e.target.value })} placeholder="MO-0004" /></Field>
            <Field label="商品(任意)">
              <select className="fm-input" value={form.productId} onChange={(e) => onPickProduct(e.target.value)}>
                <option value="">選択しない</option>
                {data.products.map((p) => <option key={p.id} value={p.id}>{p.productCode} - {p.productName}</option>)}
              </select>
            </Field>
            <Field label="製品名">
              <input
                className="fm-input"
                value={form.productName}
                disabled={!!form.productId}
                onChange={(e) => setForm({ ...form, productName: e.target.value })}
                placeholder="例: マスク用シート"
                style={form.productId ? { opacity: 0.65, cursor: 'not-allowed' } : undefined}
              />
            </Field>
            <Field label="ライン">
              <select className="fm-input" value={form.lineId} onChange={(e) => setForm({ ...form, lineId: e.target.value })}>
                {data.lines.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
              </select>
            </Field>
            <Field label="使用資材(任意)">
              <select className="fm-input" value={form.lotId} onChange={(e) => setForm({ ...form, lotId: e.target.value })}>
                <option value="">未指定</option>
                {sortedLots.map((l) => (
                  <option key={l.id} value={l.id}>
                    {l.lotNo} ({l.materialName}){selectedProduct && l.materialName === selectedProduct.materialType ? ' ★推奨' : ''}
                  </option>
                ))}
              </select>
            </Field>
            <Field label="目標数量(枚)"><input type="number" className="fm-input" value={form.targetQty} onChange={(e) => setForm({ ...form, targetQty: e.target.value })} placeholder="5000" /></Field>
            <Field label="開始日"><input type="date" className="fm-input" value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} /></Field>
            <Field label="終了日(納期)"><input type="date" className="fm-input" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} /></Field>
          </div>
          {form.productId && (
            <div style={{ fontSize: 11, color: C.textFaint, marginBottom: 8 }}>製品名は商品マスタから自動入力されています。変更したい場合は「選択しない」に戻してください。</div>
          )}
          {estimatedHours !== null && (
            <div style={{ fontSize: 12, color: C.teal, marginBottom: 8 }}>
              ⏱ 目安所要時間: 約{estimatedHours.toFixed(1)}時間(標準速度 {fmt(selectedProduct.speedPerHour)}枚/時間で計算)
            </div>
          )}
          {requiredMaterial !== null && (
            <div style={{ fontSize: 12, color: insufficientStock ? C.red : C.teal, marginBottom: 8 }}>
              📐 必要資材量の目安: 約{requiredMaterial.toFixed(2)}{unitLabel(selectedLot?.unit)}(1枚あたり{selectedProduct.materialPerUnit}で計算)
              {selectedLot && (insufficientStock
                ? ` — 選択中のロットの残量(${fmt(selectedLot.remainingLength)}${unitLabel(selectedLot.unit)})が不足しています`
                : ` — 選択中のロットの残量: ${fmt(selectedLot.remainingLength)}${unitLabel(selectedLot.unit)}`)}
            </div>
          )}
          {belowMinLot && (
            <div style={{ color: C.amber, fontSize: 12, marginBottom: 8 }}>⚠ この商品の最低ロット({fmt(selectedProduct.minLotQty)}枚)を下回っています。</div>
          )}
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : '計画を追加'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="生産計画の入力にはログインが必要です。" />
      )}


      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600 }}>生産計画一覧</div>
          {completedCount > 0 && <Badge tone="green">完了 {completedCount}件</Badge>}
        </div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 780 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['計画番号', '受注/得意先', '製品名', 'ライン', '資材', '進捗(たたみ済/目標)', '生産期間', '状態', ''].map((h) => (
                <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sortedRows.length === 0 && (
              <tr><td colSpan={9} style={{ padding: 14, color: C.textFaint }}>計画がありません。上のフォームから追加してください。</td></tr>
            )}
            {sortedRows.map(({ o, st, status }) => {
              const ratio = pct(st.folded, o.targetQty);
              const tone = status === '完了' ? 'green' : status === '仕掛中' ? 'teal' : 'dim';
              const lot = lotById(o.lotId);
              const so = salesOrderById(o.salesOrderId);
              const done = status === '完了';
              return (
                <tr key={o.id} style={{ borderBottom: `1px solid ${C.border}`, background: o.id === editingId ? C.tealDim + '55' : done ? 'rgba(79,179,116,0.08)' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{o.planNo}</td>
                  <td style={{ padding: '8px', fontSize: 12, color: C.textDim }}>{so ? `${so.orderNo} / ${so.customerName}` : '—'}</td>
                  <td style={{ padding: '8px' }}>{o.productName}</td>
                  <td style={{ padding: '8px' }}>{lineById(o.lineId)?.name || '—'}</td>
                  <td style={{ padding: '8px', color: C.textDim, fontSize: 12 }}>{lot ? lot.lotNo : '—'}</td>
                  <td style={{ padding: '8px', minWidth: 160 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ flex: 1 }}><ProgressBar ratio={ratio} color={done ? C.green : C.teal} /></div>
                      <span className="fm-mono" style={{ fontSize: 11, color: C.textDim, whiteSpace: 'nowrap' }}>{fmt(st.folded)}/{fmt(o.targetQty)}</span>
                    </div>
                  </td>
                  <td className="fm-mono" style={{ padding: '8px', fontSize: 12, whiteSpace: 'nowrap' }}>{planStart(o)} 〜 {planEnd(o)}</td>
                  <td style={{ padding: '8px' }}>
                    <Badge tone={tone}>{done ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><CheckCircle2 size={11} />完了</span> : status}</Badge>
                  </td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(o)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeOrder(o.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>

      {isEditor && (
        <Panel style={{ padding: 16 }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>ライン管理</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
            {data.lines.map((l) => (
              <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: 4, background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 999, padding: '4px 6px 4px 12px', fontSize: 13 }}>
                {l.name}
                <IconBtn onClick={() => removeLine(l.id)} title="ライン削除" danger />
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 8, maxWidth: 340 }}>
            <input className="fm-input" placeholder="新しいライン名 (例: ライン4)" value={newLine} onChange={(e) => setNewLine(e.target.value)} />
            <PrimaryButton onClick={() => { if (newLine.trim()) { addLine(newLine.trim()); setNewLine(''); } }}><Plus size={14} /> 追加</PrimaryButton>
          </div>
        </Panel>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 資材在庫タブ                                                         */
/* ------------------------------------------------------------------ */
function InventoryTab({ data, addLot, updateLot, removeLot, addMaterialTransaction, removeMaterialTransaction, isEditor }) {
  const blankForm = {
    lotNo: '', materialName: '', initialLength: '', remainingLength: '', receivedDate: todayStr(),
    unitPriceForeign: '',
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState('');

  const blankTxForm = { lotId: data.lots[0]?.id || '', date: todayStr(), type: '入庫', qty: '', note: '' };
  const [txForm, setTxForm] = useState(blankTxForm);
  const [txErr, setTxErr] = useState('');

  const materialTypeOptions = useMemo(
    () => [...new Set(data.products.map((p) => p.materialType).filter(Boolean))],
    [data.products],
  );

  const startEdit = (l) => {
    setEditingId(l.id);
    setForm({
      lotNo: l.lotNo, materialName: l.materialName,
      initialLength: String(l.initialLength), remainingLength: String(l.remainingLength),
      receivedDate: l.receivedDate, unitPriceForeign: String(l.unitPriceForeign || ''),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setErr(''); };

  const submit = () => {
    if (!form.lotNo || !form.materialName || !form.initialLength) {
      setErr('ロット番号・資材名・初期数量は必須です。');
      return;
    }
    setErr('');
    const payload = {
      lotNo: form.lotNo,
      materialName: form.materialName,
      initialLength: Number(form.initialLength),
      remainingLength: form.remainingLength === '' ? Number(form.initialLength) : Number(form.remainingLength),
      receivedDate: form.receivedDate,
      unitPriceForeign: Number(form.unitPriceForeign) || 0,
      currency: 'JPY',
      exchangeRate: 1,
    };
    if (editingId) {
      updateLot(editingId, payload);
      setEditingId(null);
    } else {
      addLot(payload);
    }
    setForm(blankForm);
  };

  const totalInventoryValue = data.lots.reduce((sum, l) => sum + lotTotalCostJPY(l) * (num(l.initialLength) > 0 ? num(l.remainingLength) / num(l.initialLength) : 0), 0);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <StatCard icon={Coins} label="在庫金額(円・残量ベース)" value={fmt(Math.round(totalInventoryValue))} unit="円" tone="amber" />
        <StatCard icon={Package} label="ロット数" value={data.lots.length} unit="件" tone="teal" />
      </div>

      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{editingId ? '資材ロットを編集' : '資材ロットを追加'}</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>円での仕入単価を記録すると、在庫金額が自動計算されます。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="ロット番号"><input className="fm-input" value={form.lotNo} onChange={(e) => setForm({ ...form, lotNo: e.target.value })} placeholder="PP-20260727" /></Field>
            <Field label="資材名">
              <input list="material-type-options" className="fm-input" value={form.materialName} onChange={(e) => setForm({ ...form, materialName: e.target.value })} placeholder="PP不織布 20g/m²" />
              <datalist id="material-type-options">
                {materialTypeOptions.map((m) => <option key={m} value={m} />)}
              </datalist>
            </Field>
            <Field label="初期数量(個)"><input type="number" className="fm-input" value={form.initialLength} onChange={(e) => setForm({ ...form, initialLength: e.target.value })} placeholder="3000" /></Field>
            <Field label="単価(円)"><input type="number" step="0.01" className="fm-input" value={form.unitPriceForeign} onChange={(e) => setForm({ ...form, unitPriceForeign: e.target.value })} placeholder="63" /></Field>
            <Field label="入荷日"><input type="date" className="fm-input" value={form.receivedDate} onChange={(e) => setForm({ ...form, receivedDate: e.target.value })} /></Field>
          </div>
          {err && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{err}</div>}
          <div style={{ display: 'flex', gap: 8 }}>
            <PrimaryButton onClick={submit}>{editingId ? <CheckCircle2 size={14} /> : <Plus size={14} />} {editingId ? '更新を保存' : 'ロットを追加'}</PrimaryButton>
            {editingId && <PrimaryButton onClick={cancelEdit} style={{ background: C.panelAlt2, color: C.text }}>キャンセル</PrimaryButton>}
          </div>
        </Panel>
      ) : (
        <LockedNotice text="資材ロットの入力にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>資材在庫一覧</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 680 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['ロット番号', '資材名', '残量', '単価(円)', '入荷日', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {data.lots.length === 0 && (
              <tr><td colSpan={6} style={{ padding: 14, color: C.textFaint }}>資材ロットがありません。</td></tr>
            )}
            {data.lots.map((l) => {
              const ratio = pct(l.remainingLength, l.initialLength);
              const low = ratio < 20;
              const unitCost = lotUnitCostJPY(l);
              return (
                <tr key={l.id} style={{ borderBottom: `1px solid ${C.border}`, background: l.id === editingId ? C.tealDim + '55' : 'transparent' }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{l.lotNo}</td>
                  <td style={{ padding: '8px' }}>{l.materialName}</td>
                  <td style={{ padding: '8px', minWidth: 200 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ flex: 1 }}><ProgressBar ratio={ratio} color={low ? C.red : C.teal} /></div>
                      <span className="fm-mono" style={{ fontSize: 11, whiteSpace: 'nowrap', color: low ? C.red : C.textDim }}>{fmt(l.remainingLength)}/{fmt(l.initialLength)}{unitLabel(l.unit)}</span>
                    </div>
                  </td>
                  <td className="fm-mono" style={{ padding: '8px', color: C.amber }}>{unitCost.toFixed(2)}円</td>
                  <td className="fm-mono" style={{ padding: '8px' }}>{l.receivedDate}</td>
                  <td style={{ padding: '8px', display: 'flex', gap: 2 }}>
                    {isEditor && <IconBtn onClick={() => startEdit(l)} title="編集" icon={Pencil} />}
                    {isEditor && <IconBtn onClick={() => removeLot(l.id)} title="削除" danger />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>

      {isEditor ? (
        <Panel style={{ padding: 16 }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>入出庫を記録</div>
          <div style={{ fontSize: 12, color: C.textFaint, marginBottom: 12 }}>生産計画とは関係なく、日々の資材の増減(仕入れ・使用・廃棄・棚卸調整など)だけを記録できます。</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="資材(ロット)">
              <select className="fm-input" value={txForm.lotId} onChange={(e) => setTxForm({ ...txForm, lotId: e.target.value })}>
                {data.lots.length === 0 && <option value="">先に資材ロットを登録してください</option>}
                {data.lots.map((l) => <option key={l.id} value={l.id}>{l.lotNo} ({l.materialName})</option>)}
              </select>
            </Field>
            <Field label="日付"><input type="date" className="fm-input" value={txForm.date} onChange={(e) => setTxForm({ ...txForm, date: e.target.value })} /></Field>
            <Field label="種別">
              <select className="fm-input" value={txForm.type} onChange={(e) => setTxForm({ ...txForm, type: e.target.value })}>
                <option value="入庫">入庫(増える)</option>
                <option value="出庫">出庫(減る)</option>
              </select>
            </Field>
            <Field label="数量"><input type="number" className="fm-input" value={txForm.qty} onChange={(e) => setTxForm({ ...txForm, qty: e.target.value })} placeholder="50" /></Field>
            <Field label="メモ(任意)"><input className="fm-input" value={txForm.note} onChange={(e) => setTxForm({ ...txForm, note: e.target.value })} placeholder="例: 追加仕入れ / 廃棄 / 棚卸調整" /></Field>
          </div>
          {txErr && <div style={{ color: C.red, fontSize: 12, marginBottom: 8 }}>{txErr}</div>}
          <PrimaryButton
            onClick={() => {
              if (!txForm.lotId || !txForm.date || !txForm.qty) {
                setTxErr('資材・日付・数量は必須です。');
                return;
              }
              setTxErr('');
              addMaterialTransaction({ ...txForm, qty: Number(txForm.qty) });
              setTxForm({ ...txForm, qty: '', note: '' });
            }}
          ><Plus size={14} /> 記録する</PrimaryButton>
        </Panel>
      ) : (
        <LockedNotice text="入出庫の記録にはログインが必要です。" />
      )}

      <Panel style={{ padding: 16, overflowX: 'auto' }}>
        <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>入出庫履歴</div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, minWidth: 600 }}>
          <thead>
            <tr style={{ textAlign: 'left', color: C.textDim, borderBottom: `1px solid ${C.border}` }}>
              {['日付', '資材', '種別', '数量', 'メモ', ''].map((h) => <th key={h} style={{ padding: '6px 8px', fontWeight: 500 }}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {data.materialTransactions.length === 0 && (
              <tr><td colSpan={6} style={{ padding: 14, color: C.textFaint }}>まだ入出庫の記録がありません。</td></tr>
            )}
            {[...data.materialTransactions].sort((a, b) => (a.date < b.date ? 1 : -1)).map((tx) => {
              const lot = data.lots.find((l) => l.id === tx.lotId);
              return (
                <tr key={tx.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                  <td className="fm-mono" style={{ padding: '8px' }}>{tx.date}</td>
                  <td style={{ padding: '8px' }}>{lot ? `${lot.lotNo} (${lot.materialName})` : '(削除済み)'}</td>
                  <td style={{ padding: '8px' }}><Badge tone={tx.type === '入庫' ? 'teal' : 'amber'}>{tx.type}</Badge></td>
                  <td className="fm-mono" style={{ padding: '8px', color: tx.type === '入庫' ? C.teal : C.amber }}>{tx.type === '入庫' ? '+' : '-'}{fmt(tx.qty)}{lot ? unitLabel(lot.unit) : ''}</td>
                  <td style={{ padding: '8px', color: C.textDim, fontSize: 12 }}>{tx.note || '—'}</td>
                  <td style={{ padding: '8px' }}>{isEditor && <IconBtn onClick={() => removeMaterialTransaction(tx.id)} title="削除" danger />}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 生産実績・WIPタブ                                                    */
/* ------------------------------------------------------------------ */
function ProductionTab({ data, addRecord, updateRecord, removeRecord, lineById, orderById, orderStats, productById, lotById, isEditor }) {
  const blankForm = {
    date: todayStr(), orderId: data.orders[0]?.id || '', worker: '', machineUpQty: '', inspectedQty: '', foldedQty: '', defectQty: '', defectCause: '', defectNote: '', materialUsedLength: '',
  };
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [materialAuto, setMaterialAuto] = useState(true);
  const [err, setErr] = useState('');

  const workerOptions = useMemo(
    () => [...new Set(data.records.map((r) => r.worker).filter(Boolean))],
    [data.records],
  );

  const linkedProduct = useMemo(() => {
    const ord = orderById(form.orderId);
    return ord && ord.productId ? productById(ord.productId) : null;
  }, [form.orderId, orderById, productById]);

  const linkedLot = useMemo(() => {
    const ord = orderById(form.orderId);
    return ord && ord.lotId ? lotById(ord.lotId) : null;
  }, [form.orderId, orderById, lotById]);

  // 資材使用量の自動計算(担当者が直接編集したら自動計算を止める)
  useEffect(() => {
    if (!materialAuto) return;
    if (linkedProduct && linkedProduct.materialPerUnit > 0 && form.machineUpQty !== '') {
      const calc = (Number(form.machineUpQty) || 0) * linkedProduct.materialPerUnit;
      setForm((f) => ({ ...f, materialUsedLength: calc ? String(Math.round(calc * 100) / 100) : '' }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form.orderId, form.machineUpQty, materialAuto, linkedProduct]);

  const materialInsufficient = linkedLot && form.materialUsedLength !== '' && Number(form.materialUsedLength) > num(linkedLot.remainingLength);

  const startEdit = (r) => {
    setEditingId(r.id);
    setMaterialAuto(false);
    setForm({
      date: r.date, orderId: r.orderId, worker: r.worker || '',
      machineUpQty: String(r.machineUpQty ?? ''), inspectedQty: String(r.inspectedQty ?? ''),
      foldedQty: String(r.foldedQty ?? ''), defectQty: String(r.defectQty ?? ''),
      defectCause: r.defectCause || '', defectNote: r.defectNote || '', materialUsedLength: String(r.materialUsedLength ?? ''),
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(blankForm); setMaterialAuto(true); setErr(''); };

  const submit = () => {
    if (!form.orderId || !form.date || !form.worker || form.machineUpQty === '') {
      setErr('日付・担当者・計画・機械上がり数は必須です。');
      return;
    }
    setErr('');
    const ord = orderById(form.orderId);
    const payload = {
      date: form.date,
      orderId: form.orderId,
      lineId: ord?.lineId,
      worker: form.worker,
      machineUpQty: Number(form.machineUpQty) || 0,
      inspectedQty: Number(form.inspectedQty) || 0,
      foldedQty: Number(form.foldedQty) || 0,
      defectQty: Number(form.defectQty) || 0,
      defectCause: Number(form.defectQty) > 0 ? form.defectCause : '',
      defectNote: form.defectNote,
      materialUsedLength: Number(form.materialUsedLength) || 0,
    };
    if (editingId) {
      updateRecord(editingId, payload);
      setEditingId(null);
      setForm(blankForm);
      setMaterialAuto(true);
    } else {
      addRecord(payload);
      setForm({ ...form, worker: '', machineUpQty: '', inspectedQty: '', foldedQty: '', defectQty: '', defectCause: '', defectNote: '', materialUsedLength: '' });
      setMaterialAuto(true);
    }
  };

  const workerOrderStats = useMemo(() => {
    const map = {};
    data.records.forEach((r) => {
      const key = `${r.orderId}||${r.worker || '未記入'}`;
      if (!map[key]) map[key] = { orderId: r.orderId, worker: r.worker || '未記入', machineUp: 0, folded: 0, defect: 0 };
      map[key].machineUp += num(r.machineUpQty);
      map[key].folded += num(r.foldedQty);
      map[key].defect += num(r.defectQty);
    });
    return Object.values(map).sort((a, b) => {
      const an = orderById(a.orderId)?.planNo || '';
      const bn = orderById(b.orderId)?.planNo || '';
      return an.localeCompare(bn) || a.worker.localeCompare(b.worker);
    });
  }, [data.records, orderById]);

  const sortedRecords = [...data.records].sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {isEditor ? (
        <Panel style={{ padding: 16, border: editingId ? `1px solid ${C.teal}` : undefined }}>
          <div className="fm-display" style={{ fontSize: 16, fontWeight: 600, marginBottom: 12 }}>{editingId ? '実績を編集' : '実績を入力'}</div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
            <Field label="日付"><input type="date" className="fm-input" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="生産計画">
              <select className="fm-input" value={form.orderId} onChange={(e) => setForm({ ...form, orderId: e.target.value })}>
                {data.orders.map((o) => <option key={o.id} value={o.id}>{o.planNo} - {o.productName} ({lineById(o.lineId)?.name})</option>)}
              </select>
            </Field>
            <Field label="担当者">
